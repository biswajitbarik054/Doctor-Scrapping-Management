<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Content App</title>
    <!-- Bootstrap CSS for easy styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-img-top { height: 200px; object-fit: cover; }
        .speciality-badge { position: absolute; top: 10px; right: 10px; z-index: 10; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="mb-4 text-center text-primary fw-bold">Trending Topics</h2>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <!-- Loop through each topic in the database -->
        <div class="col" th:each="topic : ${topics}">
            <div class="card h-100 shadow-sm position-relative">

                <span class="badge bg-primary speciality-badge" th:text="${topic.speciality}"></span>

                <!-- Show image if it exists, otherwise show a placeholder -->
                <img th:if="${topic.imageUrl != null}" th:src="${topic.imageUrl}" class="card-img-top" alt="News Image">
                <img th:if="${topic.imageUrl == null}" src="https://via.placeholder.com/400x200?text=No+Image" class="card-img-top" alt="Placeholder">

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold" th:text="${topic.title}"></h5>
                    <p class="card-text text-muted small" th:text="${topic.contentPreview}"></p>

                    <a th:href="${topic.sourceUrl}" target="_blank" class="btn btn-outline-primary mt-auto w-100">Read Full Article</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
